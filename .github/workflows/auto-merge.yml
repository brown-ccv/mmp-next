name: Auto Merge CMS Branch

# TODO: This workflow pushes directly to main, which is why main currently has no
# branch protection rules. See "CMS publishing workflow" in README.md for the full
# list of known issues and the proposed replacement design. Nothing below is safe to
# change in isolation -- the pieces (polling, inactivity window, direct push) are
# load-bearing for the App Hosting rollout behavior described in the README.

on:
  schedule:
    # Run every 5 minutes to check for inactivity
    # TODO: Polling is wasteful (~8,600 no-op runs/month, each a full-history clone)
    # and unreliable -- GitHub delays or drops scheduled runs under load, and disables
    # them entirely after 60 days of repo inactivity (plausible for this site over a
    # summer break). `on: push: branches: [cms]` would be immediate and free, but see
    # the TODO on the inactivity check below before switching: the delay is doing real
    # work here, not just saving runner minutes.
    - cron: "*/5 * * * *"

  # Allow manual triggering
  workflow_dispatch:

jobs:
  auto-merge:
    runs-on: ubuntu-latest

    steps:
      # TODO: No concurrency group. A slow run and the next cron tick (5 min later) can
      # overlap and race on pushing main. A `concurrency` block with
      # cancel-in-progress: false would serialize them.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for all branches

      - name: Check CMS branch and merge if inactive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git fetch origin cms; then
            last_commit_time=$(git log -1 --format=%ct "origin/cms")
            current_time=$(date +%s)

            time_diff=$(( ($current_time - $last_commit_time) / 60 ))

            # TODO: This 20-minute inactivity window is load-bearing for more than just
            # batching commits. Firebase App Hosting has a bug where multiple pushes to
            # main in quick succession corrupt the backend container -- recovering has
            # previously required deleting and recreating the entire App Hosting setup.
            # The delay is what keeps rollouts spaced apart. Do NOT reduce it or switch
            # to a push trigger without first adding explicit rollout serialization
            # (see README).
            if [ $time_diff -gt 20 ]; then
              echo "CMS branch has been inactive for $time_diff minutes"

              git config user.name "GitHub Actions Bot"
              git config user.email "actions@github.com"

              git checkout cms

              if git merge origin/main --no-edit; then
                echo "Successfully merged main into cms"

                git checkout main
                git merge cms --no-edit
                # TODO: Direct push to main. No lint or build runs against this content
                # first, so a malformed frontmatter block, a bad `tags` value, or a page
                # referencing a deleted image goes straight to production and breaks the
                # build. There is currently no CI in this repo at all. A PR + required
                # build check would let main be protected and catch this earlier.
                git push origin main

                echo "Successfully merged cms into main"
              else
                # TODO: Silent failure. On conflict this aborts and logs, so a stuck sync
                # is invisible -- every subsequent run that day fails the same way with
                # nobody notified, and editor changes silently stop reaching the site.
                # Should open an issue or otherwise alert a maintainer.
                echo "Merge conflicts detected in cms branch, skipping..."
                git merge --abort
              fi
            else
              echo "CMS branch has been active within the last 20 minutes, skipping..."
            fi
          else
            echo "CMS branch not found"
          fi

permissions:
  contents: write
  pull-requests: write
